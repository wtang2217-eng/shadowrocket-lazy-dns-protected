# ===== 5) IP 兜底：命中国内 IP 直连（no-resolve 不触发解析→绝不泄露）=====
GEOIP,CN,DIRECT,no-resolve

# ===== 6) 其余（国外 + 未知）→ 代理 =====
FINAL,PROXY

[Host]
# 加密 DNS 端点的引导，避免解析它们本身时用 system
